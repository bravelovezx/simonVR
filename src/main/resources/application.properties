spring.application.name=Simon

server.port=8080

# Mybatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-handlers-package=com.example.simon.dao

# MySQL
mybatis.type-aliases-package=com.example.simon.entity
spring.datasource.url=jdbc:mysql://localhost:3306/mybatis?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver